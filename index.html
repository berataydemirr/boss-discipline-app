<!doctype html>
<html lang="en" data-theme="dark" data-accent="ember">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BOSS</title>
    <meta name="description" content="BOSS — personal discipline and habit tracker" />
    <meta name="theme-color" content="#11100e" />
    <meta name="color-scheme" content="dark light" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BOSS" />

    <script>
      // Avoid a theme flash: apply the saved theme before CSS loads.
      (function () {
        try {
          var t = localStorage.getItem('boss:theme') || 'system';
          var a = localStorage.getItem('boss:accent') || 'ember';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
          document.documentElement.dataset.accent = a;
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
    />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/views.css" />
    <link rel="stylesheet" href="./css/charts.css" />
    <link rel="stylesheet" href="./css/insights.css" />
    <link rel="stylesheet" href="./css/plan-focus.css" />

    <script src="./js/version.js"></script>
    <script src="./js/reminder-core.js"></script>
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <main id="view" class="view" tabindex="-1">
        <div class="boot" aria-hidden="true"></div>
      </main>
      <nav id="tabbar" class="tabbar" aria-label="Main navigation"></nav>
    </div>
    <div id="sheet-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui">BOSS needs JavaScript to run.</p>
    </noscript>
  </body>
</html>
